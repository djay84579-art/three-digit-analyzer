<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC28 · 实时开奖 + 统计参考</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 color:#fff;
 font-family:Arial,"Microsoft YaHei",sans-serif;
 background:#090914;
}
.header{
 padding:28px 20px;
 background:linear-gradient(135deg,#25145e,#17104b,#080b22);
}
.header h1{
 margin:0;
 font-size:30px;
}
.header p{
 margin:12px 0 0;
 color:#bbb;
 font-size:16px;
}
.wrap{
 max-width:900px;
 margin:auto;
 padding:16px;
}
.card{
 margin-bottom:16px;
 padding:20px;
 border:1px solid #444;
 border-radius:22px;
 background:rgba(15,15,25,.94);
 box-shadow:0 8px 30px rgba(0,0,0,.25);
}
.card h2{
 margin:0 0 18px;
 font-size:23px;
}
.status{
 color:#bbb;
 line-height:1.7;
}
.ok{color:#61e294}
.err{color:#ff7272}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.box{
 padding:18px;
 border-radius:18px;
 background:#1b1b28;
}
.box span{
 display:block;
 color:#999;
 margin-bottom:8px;
}
.box b{
 font-size:25px;
}
.pred{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.pred .box{
 background:linear-gradient(135deg,#21154d,#17172a);
}
.hot{
 color:#ffd86b;
}
table{
 width:100%;
 border-collapse:collapse;
 font-size:14px;
}
th,td{
 padding:10px 6px;
 border-bottom:1px solid #333;
 text-align:center;
}
th{color:#aaa}
button{
 border:0;
 border-radius:12px;
 padding:10px 18px;
 background:#302064;
 color:#fff;
 font-size:16px;
}

 color:#888
