name: PC28 Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pc28-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests beautifulsoup4

      - name: Monitor PC28
        run: |
          python - <<'PY'
          import requests
          import re
          import json
          import time
          import subprocess

          from bs4 import BeautifulSoup


          URL = "https://t.me/s/pc28"

          # 本轮运行约 50 分钟
          END_TIME = time.time() + 3000

          session = requests.Session()

          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })


          def load_data():

              try:

                  with open(
                      "data.json",
                      "r",
                      encoding="utf-8"
                  ) as f:

                      obj = json.load(f)

                  return {
                      str(x["issue"]): x
                      for x in obj.get("results", [])
                      if "issue" in x
                  }

              except Exception:

                  return {}


          def save_data(data):

              result = {
                  "count": len(data),

                  "results": sorted(
                      data.values(),
                      key=lambda x: int(x["issue"]),
                      reverse=True
                  )
              }

              with open(
                  "data.json",
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      result,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def git_push():

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      "data.json"
                  ],
                  check=True
              )

              result = subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update PC28"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode == 0:

                  subprocess.run(
                      [
                          "git",
                          "push"
                      ],
                      check=True
                  )

                  return True

              return False


          data = load_data()

          print(
              "启动 PC28 高频监测"
          )

          print(
              "当前已有:",
              len(data),
              "期"
          )


          while time.time() < END_TIME:

              try:

                  response = session.get(
                      URL,
                      timeout=15
                  )

                  response.raise_for_status()

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

                  changed = False

                  for message in soup.select(
                      ".tgme_widget_message"
                  ):

                      text = message.get_text(
                          " ",
                          strip=True
                      )

                      match = re.search(
                          r"(\d{6,})\s*期"
                          r".*?"
                          r"([0-9])\s*\+\s*"
                          r"([0-9])\s*\+\s*"
                          r"([0-9])\s*=\s*"
                          r"(\d+)",
                          text
                      )

                      if not match:
                          continue


                      issue, a, b, c, total = match.groups()

                      a = int(a)
                      b = int(b)
                      c = int(c)
                      total = int(total)


                      if a + b + c != total:
                          continue


                      item = {
                          "issue": issue,
                          "a": a,
                          "b": b,
                          "c": c,
                          "sum": total
                      }


                      if data.get(issue) != item:

                          data[issue] = item

                          changed = True


                  if changed:

                      save_data(data)

                      newest = max(
                          data.keys(),
                          key=lambda x: int(x)
                      )

                      print(
                          "发现新数据:",
                          newest,
                          "| 当前共:",
                          len(data),
                          "期"
                      )

                      git_push()

                  else:

                      if data:

                          newest = max(
                              data.keys(),
                              key=lambda x: int(x)
                          )

                      else:

                          newest = "暂无"


                      print(
                          "监测中 | 最新:",
                          newest,
                          "| 总数:",
                          len(data)
                      )


              except Exception as e:

                  print(
                      "抓取失败:",
                      repr(e)
                  )


              # 每 5 秒检查一次
              time.sleep(5)


          print(
              "本次监测结束 | 共记录:",
              len(data),
              "期"
          )


          if data:

              newest = max(
                  data.keys(),
                  key=lambda x: int(x)
              )

              print(
                  "最终最新期:",
                  newest
              )

          PY


      - name: Auto Restart
        if: always()
        env:
          PC28_TOKEN: ${{ secrets.PC28_TOKEN }}
        run: |

          echo "等待 5 秒后启动下一轮..."

          sleep 5

          echo "正在启动下一轮 PC28..."

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PC28_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pc28.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "下一轮已请求启动"
