name: PC28 Update

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import re
          import requests
          from datetime import datetime, timezone

          URL = "https://t.me/s/pc28"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Linux; Android 10) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120.0 Mobile Safari/537.36"
              )
          }

          print("正在读取 Telegram 公开频道...")

          r = requests.get(
              URL,
              headers=headers,
              timeout=20
          )

          r.raise_for_status()

          html = r.text

          # 提取 Telegram 页面中的文本
          text = re.sub(r"<[^>]+>", " ", html)
          text = re.sub(r"\s+", " ", text)

          results = []

          # 常见 PC28 三位开奖号码格式
          patterns = [
              r"(\d{3,})\D{0,20}([0-9])\s*\+\s*([0-9])\s*\+\s*([0-9])",
              r"(\d{3,})\D{0,20}([0-9])\s+([0-9])\s+([0-9])"
          ]

          for pattern in patterns:
              for m in re.finditer(pattern, text):
                  issue = m.group(1)
                  a = int(m.group(2))
                  b = int(m.group(3))
                  c = int(m.group(4))

                  if a > 9 or b > 9 or c > 9:
                      continue

                  total = a + b + c

                  item = {
                      "issue": issue,
                      "a": a,
                      "b": b,
                      "c": c,
                      "sum": total
                  }

                  if not any(
                      x["issue"] == issue
                      for x in results
                  ):
                      results.append(item)

          # 按期号倒序
          results.sort(
              key=lambda x: int(
                  re.sub(r"\D", "", str(x["issue"])) or "0"
              ),
              reverse=True
          )

          # 最多保留 300 期，避免 data.json 无限变大
          results = results[:300]

          if not results:
              raise SystemExit(
                  "没有从 Telegram 页面找到有效开奖数据"
              )

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "results": results
          }

          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("成功读取：", len(results), "期")
          print("最新数据：", results[0])
          PY

      - name: Check changes
        id: changes
        run: |
          git diff --quiet data.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git commit -m "PC28 Update"

          git push
