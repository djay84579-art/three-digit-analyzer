name: PC28 Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Monitor PC28
        run: |
          python - <<'PY'
          import requests
          import re
          import json
          import time
          import subprocess
          from bs4 import BeautifulSoup

          URL = "https://t.me/s/pc28"
          END_TIME = time.time() + 270

          def load_old():
              try:
                  with open("data.json", "r", encoding="utf-8") as f:
                      obj = json.load(f)
                      return {
                          str(x["issue"]): x
                          for x in obj.get("results", [])
                      }
              except:
                  return {}

          def save_data(old):
              data = {
                  "count": len(old),
                  "results": sorted(
                      old.values(),
                      key=lambda x: int(x["issue"]),
                      reverse=True
                  )
              }

              with open("data.json", "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          old = load_old()
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          last_count = len(old)

          while time.time() < END_TIME:
              try:
                  r = session.get(URL, timeout=20)
                  soup = BeautifulSoup(r.text, "html.parser")

                  changed = False

                  for m in soup.select(".tgme_widget_message"):
                      t = m.get_text(" ", strip=True)

                      x = re.search(
                          r"(\d{6,})\s*期.*?([0-9])\s*\+\s*([0-9])\s*\+\s*([0-9])\s*=\s*(\d+)",
                          t
                      )

                      if not x:
                          continue

                      issue, a, b, c, total = x.groups()

                      a = int(a)
                      b = int(b)
                      c = int(c)
                      total = int(total)

                      if a + b + c != total:
                          continue

                      item = {
                          "issue": issue,
                          "a": a,
                          "b": b,
                          "c": c,
                          "sum": total
                      }

                      if old.get(issue) != item:
                          old[issue] = item
                          changed = True

                  if changed:
                      save_data(old)

                      subprocess.run(
                          ["git", "config", "user.name", "github-actions[bot]"],
                          check=True
                      )
                      subprocess.run(
                          ["git", "config", "user.email",
                           "41898282+github-actions[bot]@users.noreply.github.com"],
                          check=True
                      )

                      subprocess.run(
                          ["git", "add", "data.json"],
                          check=True
                      )

                      result = subprocess.run(
                          ["git", "commit", "-m", "Update PC28"],
                          capture_output=True,
                          text=True
                      )

                      if result.returncode == 0:
                          subprocess.run(
                              ["git", "push"],
                              check=True
                          )

                          print(
                              "发现新数据，当前共",
                              len(old),
                              "期"
                          )

                  print(
                      "监测中，目前",
                      len(old),
                      "期"
                  )

              except Exception as e:
                  print("本轮抓取失败:", e)

              time.sleep(20)

          print("本次监测结束，共记录", len(old), "期")
          PY
