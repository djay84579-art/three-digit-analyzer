name: PC28 Update

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc28-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          URL = "https://t.me/s/pc28"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Linux; Android 10) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120.0 Mobile Safari/537.36"
              ),
              "Accept": "text/html,application/xhtml+xml",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          print("正在读取 Telegram...")

          req = urllib.request.Request(
              URL,
              headers=headers
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  html = response.read().decode("utf-8", errors="ignore")
          except Exception as e:
              raise SystemExit("Telegram 读取失败: " + str(e))

          text = re.sub(
              r"<script[\s\S]*?</script>",
              " ",
              html,
              flags=re.I
          )

          text = re.sub(
              r"<style[\s\S]*?</style>",
              " ",
              text,
              flags=re.I
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          results = []

          patterns = [
              re.compile(
                  r"(\d{3,})\D{0,30}"
                  r"([0-9])\s*\+\s*"
                  r"([0-9])\s*\+\s*"
                  r"([0-9])"
              ),
              re.compile(
                  r"(\d{3,})\D{0,30}"
                  r"([0-9])\s+([0-9])\s+([0-9])"
              )
          ]

          for pattern in patterns:
              for match in pattern.finditer(text):
                  issue = match.group(1)
                  a = int(match.group(2))
                  b = int(match.group(3))
                  c = int(match.group(4))

                  if not (
                      0 <= a <= 9 and
                      0 <= b <= 9 and
                      0 <= c <= 9
                  ):
                      continue

                  item = {
                      "issue": issue,
                      "a": a,
                      "b": b,
                      "c": c,
                      "sum": a + b + c
                  }

                  if not any(x["issue"] == issue for x in results):
                      results.append(item)

          def issue_number(x):
              s = re.sub(r"\D", "", str(x["issue"]))
              return int(s or 0)

          results.sort(key=issue_number, reverse=True)
          results = results[:300]

          if not results:
              raise SystemExit("没有找到有效开奖数据")

          latest = results[0]

          print(
              "最新：",
              latest["issue"],
              latest["a"],
              latest["b"],
              latest["c"],
              "和值",
              latest["sum"]
          )

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "results": results
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("成功保存", len(results), "期")
          PY

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据没有变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "发现新数据"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update PC28 data"
          git push
