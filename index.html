<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quantum 4-Chaos Code Engine</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --text: #f8fafc; --text-muted: #94a3b8;
        --accent-1: #00f0ff; --accent-2: #ff00ea;
        --accent-3: #ffd700; --accent-4: #00ff88;
        --success: #00ff88; --danger: #ff3366;
        --glass-bg: rgba(15, 23, 42, 0.65); --glass-border: rgba(255, 255, 255, 0.12);
    }
    body {
        font-family: 'Segoe UI', -apple-system, sans-serif; background-color: #030712; color: var(--text);
        padding: 15px; padding-bottom: 60px; min-height: 100vh;
        background-image: 
            radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.12), transparent 40%),
            radial-gradient(circle at 85% 30%, rgba(255, 0, 234, 0.12), transparent 40%),
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
        background-attachment: fixed;
    }
    .container { max-width: 500px; margin: 0 auto; position: relative; z-index: 1;}

    .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
    .header-left h1 { font-size: 24px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-left p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .time-box { text-align: right; }
    .time-box .time { font-size: 18px; font-weight: 700; color: var(--accent-1); font-family: monospace; }
    .time-box .date { font-size: 11px; color: var(--text-muted); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; backdrop-filter: blur(12px); position: relative; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; }
    .stat-card.a1::before { background: linear-gradient(90deg, transparent, var(--accent-1), transparent); }
    .stat-card.a2::before { background: linear-gradient(90deg, transparent, var(--accent-2), transparent); }
    .stat-card.a3::before { background: linear-gradient(90deg, transparent, var(--accent-3), transparent); }
    .stat-card.a4::before { background: linear-gradient(90deg, transparent, var(--accent-4), transparent); }
    
    .stat-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 800; line-height: 1; }
    .stat-card.a1 .stat-value { color: var(--accent-1); }
    .stat-card.a2 .stat-value { color: var(--accent-2); }
    .stat-card.a3 .stat-value { color: var(--accent-3); }
    .stat-card.a4 .stat-value { color: var(--accent-4); }
    .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px; margin-bottom: 15px; backdrop-filter: blur(12px); }
    .panel-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between;}
    
    .latest-row { display: flex; justify-content: space-between; align-items: center; }
    .latest-period { font-size: 18px; font-weight: 800; color: var(--accent-1); }
    .latest-type { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); color: var(--accent-1); }
    .latest-nums { font-size: 28px; font-weight: 800; font-family: monospace; letter-spacing: 4px; text-align: center; padding: 10px 0; }
    #countdown { text-align: center; margin-top: 5px; font-size: 14px; color: var(--text-muted); font-family: monospace; }
    #srcTag { font-size: 10px; color: #64748b; cursor: pointer; }

    .pred-area { display: none; margin-bottom: 15px; }
    .pred-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
    .pred-card-header { display: flex; justify-content: space-between; margin-bottom: 6px;}
    .pred-value { font-size: 20px; font-weight: 800; }
    .pred-card.a1 .pred-value { color: var(--accent-1); }
    .pred-card.a2 .pred-value { color: var(--accent-2); }
    .pred-card.a3 .pred-value { color: var(--accent-3); }
    .pred-card.a4 .pred-value { color: var(--accent-4); }
    .special-codes { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
    .code-badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: #fff; font-weight: bold; font-family: monospace; }
    .detail-toggle { font-size: 12px; color: #64748b; cursor: pointer; text-decoration: underline; }
    .detail-content { display: none; font-size: 11px; color: #94a3b8; font-family: monospace; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 6px; margin-top: 8px; line-height: 1.6; word-break: break-all; border: 1px solid rgba(255,255,255,0.05); }
    .detail-content.show { display: block; }

    .history-item { padding: 12px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; font-size: 13px; background: var(--glass-bg); }
    .history-item:first-child { border-radius: 12px 12px 0 0; }
    .history-item:last-child { border-bottom: none; border-radius: 0 0 12px 12px; }
    .badge { font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 4px; margin-left: 2px; }
    .badge.hit { background: rgba(0, 255, 136, 0.15); color: var(--success); border: 1px solid rgba(0, 255, 136, 0.3); }
    .badge.miss { background: rgba(255, 51, 102, 0.15); color: var(--danger); border: 1px solid rgba(255, 51, 102, 0.3); }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>Quantum 4</h1>
                <p>CHAOS CODE ENGINE</p>
            </div>
            <div class="time-box">
                <div class="time" id="clock">00:00:00</div>
                <div class="date" id="date">----</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card a1">
                <div class="stat-label">深渊一 · 整数截断</div>
                <div class="stat-value" id="stat1">0</div>
                <div class="stat-sub">连中 | 累计 <span id="total1">0</span> · <span id="rate1">0%</span></div>
            </div>
            <div class="stat-card a2">
                <div class="stat-label">深渊二 · 小数提取</div>
                <div class="stat-value" id="stat2">0</div>
                <div class="stat-sub">连中 | 累计 <span id="total2">0</span> · <span id="rate2">0%</span></div>
            </div>
            <div class="stat-card a3">
                <div class="stat-label">深渊三 · 特征相加</div>
                <div class="stat-value" id="stat3">0</div>
                <div class="stat-sub">连中 | 累计 <span id="total3">0</span> · <span id="rate3">0%</span></div>
            </div>
            <div class="stat-card a4">
                <div class="stat-label">深渊四 · 末位拼接</div>
                <div class="stat-value" id="stat4">0</div>
                <div class="stat-sub">连中 | 累计 <span id="total4">0</span> · <span id="rate4">0%</span></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <span>实时开奖数据</span>
                <span id="srcTag" onclick="forceRefresh()">连接中...</span>
            </div>
            <div class="latest-row">
                <span class="latest-period" id="latestPeriod">----期</span>
                <span class="latest-type" id="latestType">--</span>
            </div>
            <div class="latest-nums" id="latestNums">- + - + -</div>
            <div id="countdown">⏳ 加载中...</div>
        </div>

        <div class="pred-area" id="predArea">
            <div class="pred-card a1">
                <div class="pred-card-header">
                    <div class="stat-label" style="color:var(--accent-1);" id="title1">深渊一预测</div>
                    <div class="detail-toggle" onclick="toggle('dt1')">查看算法</div>
                </div>
                <div class="pred-value" id="outP1">--</div>
                <div class="special-codes" id="codes1"><span>特码:</span></div>
                <div class="detail-content" id="dt1"></div>
            </div>
            
            <div class="pred-card a2">
                <div class="pred-card-header">
                    <div class="stat-label" style="color:var(--accent-2);" id="title2">深渊二预测</div>
                    <div class="detail-toggle" onclick="toggle('dt2')">查看算法</div>
                </div>
                <div class="pred-value" id="outP2">--</div>
                <div class="special-codes" id="codes2"><span>特码:</span></div>
                <div class="detail-content" id="dt2"></div>
            </div>

            <div class="pred-card a3">
                <div class="pred-card-header">
                    <div class="stat-label" style="color:var(--accent-3);" id="title3">深渊三预测</div>
                    <div class="detail-toggle" onclick="toggle('dt3')">查看算法</div>
                </div>
                <div class="pred-value" id="outP3">--</div>
                <div class="special-codes" id="codes3"><span>特码:</span></div>
                <div class="detail-content" id="dt3"></div>
            </div>

            <div class="pred-card a4">
                <div class="pred-card-header">
                    <div class="stat-label" style="color:var(--accent-4);" id="title4">深渊四预测</div>
                    <div class="detail-toggle" onclick="toggle('dt4')">查看算法</div>
                </div>
                <div class="pred-value" id="outP4">--</div>
                <div class="special-codes" id="codes4"><span>特码:</span></div>
                <div class="detail-content" id="dt4"></div>
            </div>
        </div>

        <div class="history-list" id="history"></div>
    </div>

    <script>
    const $ = id => document.getElementById(id);
    function toggle(id) { $(id).classList.toggle('show'); }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    /* ============================================================
     *  极速并发网络层
     * ============================================================ */
    const SOURCES = [
        'https://jnd28.pw/api/kj?limit=500',
        'https://28.run/api/lottery/recent/100'
    ];
    const PROXIES = [
        u => u,
        u => 'https://cors.eu.org/' + u,
        u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
        u => 'https://corsproxy.io/?' + encodeURIComponent(u),
        u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)
    ];

    function parseItems(items){
        const out = [];
        for (const it of (items || [])) {
            try {
                let nums = null, s = null, expect = null, ds = '', ts = '';
                if (it.number1 != null || it.number2 != null || it.number3 != null) {
                    nums = [parseInt(it.number1, 10), parseInt(it.number2, 10), parseInt(it.number3, 10)];
                    s = it.final_result != null ? parseInt(it.final_result, 10) : nums.reduce((a, b) => a + b, 0);
                    expect = String(it.expect || it.qh || '').trim();
                    ds = String(it.opentime || it.time || '');
                } else {
                    const raw = String(it.pc28 || it.number || '');
                    nums = raw.split('+').map(x => parseInt(x.trim(), 10));
                    if (nums.length !== 3 || nums.some(n => isNaN(n))) continue;
                    s = parseInt(it.he || nums.reduce((a, b) => a + b, 0), 10);
                    expect = String(it.qh || it.expect || '').trim();
                    ds = String(it.date || ''); ts = String(it.time || '');
                }
                if (!nums || nums.length !== 3 || nums.some(n => isNaN(n))) continue;
                if (s == null || isNaN(s)) s = nums.reduce((a, b) => a + b, 0);
                if (s < 0 || s > 27) continue;
                let ot = Date.now() / 1000 | 0;
                if (ds) {
                    const p = Date.parse(String(ds).replace(/-/g, '/') + (ts ? ' ' + ts : ''));
                    if (!isNaN(p)) ot = p / 1000 | 0;
                }
                out.push({ expect, nums, sum: s, opentime: ot });
            } catch (e) {}
        }
        out.sort((a, b) => a.opentime - b.opentime);
        return out;
    }

    function extractList(j){
        if (Array.isArray(j)) return j;
        if (!j || typeof j !== 'object') return [];
        for (const k of ['data', 'list', 'rows', 'result', 'items', 'records', 'recent_results']) {
            const v = j[k];
            if (Array.isArray(v)) return v;
            if (v && typeof v === 'object') {
                for (const k2 of ['data', 'list', 'rows', 'items']) {
                    if (Array.isArray(v[k2])) return v[k2];
                }
            }
        }
        if (typeof j.contents === 'string') {
            try { return extractList(JSON.parse(j.contents)); } catch (e) {}
        }
        return [];
    }

    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(new Error('超时')), ms))]);

    async function tryOne(url){
        const r = await withTimeout(fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' }, cache: 'no-store' }), 6000);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const txt = await r.text();
        let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('非JSON'); }
        const h = parseItems(extractList(j));
        if (!h.length) throw new Error('解析0期');
        return h;
    }

    async function fetchData(){
        let urls = [];
        for (let si = 0; si < SOURCES.length; si++) {
            const u = SOURCES[si] + (SOURCES[si].indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
            for (let i = 0; i < PROXIES.length; i++) {
                urls.push({ url: PROXIES[i](u), name: `源${si+1}-代${i}` });
            }
        }
        return new Promise((resolve) => {
            let hasResolved = false;
            let failCount = 0;
            urls.forEach(async (item) => {
                try {
                    const h = await tryOne(item.url);
                    if (!hasResolved) { hasResolved = true; resolve({ ok: true, h, via: item.name }); }
                } catch (e) {
                    failCount++;
                    if (failCount === urls.length && !hasResolved) resolve({ ok: false, msg: '全通道超时' });
                }
            });
        });
    }

    /* ============================================================
     *  深渊级固定公式 + 混沌特码引擎
     * ============================================================ */
    const propertyPools = {
        '大单': [15, 17, 19, 21, 23, 25, 27],
        '大双': [14, 16, 18, 20, 22, 24, 26],
        '小单': [1, 3, 5, 7, 9, 11, 13],
        '小双': [0, 2, 4, 6, 8, 10, 12]
    };

    function getProperty(num){
        return (num > 13 ? '大' : '小') + (num % 2 === 0 ? '双' : '单');
    }

    // 【核心整改】混沌特码生成器：利用公式产出的混沌大数作为种子
    function generateChaosCodes(propStr, chaosSeedStr) {
        const pool = propertyPools[propStr];
        if (!pool) return [];
        
        // 把传进来的超级长串（去掉小数点）作为大整数进行散列
        let hash = 0;
        for (let i = 0; i < chaosSeedStr.length; i++) {
            hash = ((hash << 5) - hash) + chaosSeedStr.charCodeAt(i);
            hash = hash & hash; // 转32位整数
        }
        // 取绝对值的不同部分映射到池里
        const idx1 = Math.abs(hash) % pool.length;
        const idx2 = Math.abs(hash >> 4) % pool.length;
        
        // 保证两个特码不重复
        let finalIdx2 = (idx1 === idx2) ? (idx2 + 1) % pool.length : idx2;
        return [pool[idx1], pool[finalIdx2]];
    }

    function formatNum(num){ return num < 10 ? '0' + num : num.toString(); }

    // 运行深渊提取引擎
    function runExtractionFormulas(P) {
        let n = Math.max(1, P); 

        // 公式一：整数截断
        let f1 = Math.pow(Math.sqrt(n) * Math.log(n + 1) * Math.E, Math.PI) * n;
        let str1 = Math.floor(f1).toString();
        let v1_1 = parseInt(str1.slice(-3)) % 28;
        let v1_2 = parseInt(str1.substring(0, 3) || "0") % 28;
        let chaos1 = str1; // 混沌种子

        // 公式二：小数提取
        let f2 = Math.sin(n * Math.PI) * Math.cos(n * Math.E) * Math.sqrt(n) + (n * Math.PI * 100);
        let str2 = f2.toString().split('.')[1] || "0";
        let v2_1 = parseInt(str2.substring(0, 2) || "0") % 28;
        let v2_2 = parseInt(str2.substring(2, 4) || "0") % 28;
        let chaos2 = str2; // 混沌种子

        // 公式三：特征相加
        let f3_base = Math.sqrt(n * Math.PI) + Math.pow(n, 1.5);
        let str3 = Math.abs(f3_base).toFixed(4);
        let sumDigits = str3.split('').filter(c => c >= '0' && c <= '9').reduce((acc, cur) => acc + parseInt(cur), 0);
        let v3_1 = (sumDigits * n) % 28;
        let v3_2 = (sumDigits * n * 3.14) % 28;
        let chaos3 = str3 + sumDigits; // 混沌种子

        // 公式四：末位拼接
        let f4_a = Math.abs(Math.sin(n) * 10000) * Math.log(n+1);
        let f4_b = Math.abs(Math.cos(n) * 10000) * Math.log(n+2);
        let tailA = Math.floor(f4_a) % 10;
        let tailB = Math.floor(f4_b) % 10;
        let v4_1 = (tailA * 10 + tailB); 
        let v4_2 = (tailA * 7 + tailB * 3 + n) % 28;
        let chaos4 = f4_a.toString() + f4_b.toString(); // 混沌种子

        return {
            m1: { pa: getProperty(v1_1), pb: getProperty(v1_2), t1: f1.toFixed(2), t2: str1.slice(-10), seed: chaos1 },
            m2: { pa: getProperty(v2_1), pb: getProperty(v2_2), t1: f2.toFixed(6), t2: "小数:" + str2.substring(0, 8), seed: chaos2 },
            m3: { pa: getProperty(v3_1), pb: getProperty(v3_2), t1: f3_base.toFixed(3), t2: "各位相加=" + sumDigits, seed: chaos3 },
            m4: { pa: getProperty(v4_1), pb: getProperty(v4_2), t1: "尾数1=" + tailA, t2: "尾数2=" + tailB, seed: chaos4 }
        };
    }

    /* ============================================================
     *  状态与统计机制
     * ============================================================ */
    let draws = [];
    let lastVia = '';
    let timer = null, refreshTimer = null, requesting = false;
    
    let stats = { streak1: 0, streak2: 0, streak3: 0, streak4: 0 };
    let simStats = { total1: 0, hit1: 0, total2: 0, hit2: 0, total3: 0, hit3: 0, total4: 0, hit4: 0 };
    let snapshots = {}; 

    function loadState() {
        const s = localStorage.getItem('quantum4_stats');
        const sn = localStorage.getItem('quantum4_snapshots');
        if (s) stats = JSON.parse(s);
        if (sn) snapshots = JSON.parse(sn);
    }
    function saveState() {
        localStorage.setItem('quantum4_stats', JSON.stringify(stats));
        localStorage.setItem('quantum4_snapshots', JSON.stringify(snapshots));
    }

    function simulateHistory(list) {
        simStats = { total1: 0, hit1: 0, total2: 0, hit2: 0, total3: 0, hit3: 0, total4: 0, hit4: 0 };
        let startIdx = Math.max(0, list.length - 100);
        for (let i = startIdx; i < list.length; i++) {
            const nbrNum = parseInt(list[i].expect, 10) || 0;
            const actual = getProperty(list[i].sum);
            
            const { m1, m2, m3, m4 } = runExtractionFormulas(nbrNum);
            
            simStats.total1++; simStats.total2++; simStats.total3++; simStats.total4++;
            if (m1.pa === actual || m1.pb === actual) simStats.hit1++;
            if (m2.pa === actual || m2.pb === actual) simStats.hit2++;
            if (m3.pa === actual || m3.pb === actual) simStats.hit3++;
            if (m4.pa === actual || m4.pb === actual) simStats.hit4++;
        }
    }

    function processHistory(list) {
        let records = [];
        let curStreak1 = 0, curStreak2 = 0, curStreak3 = 0, curStreak4 = 0;
        
        for (let i = 0; i < list.length; i++) {
            const item = list[i];
            const nbrStr = item.expect;
            
            if (snapshots[nbrStr]) {
                const snap = snapshots[nbrStr];
                const actual = getProperty(item.sum);
                
                const h1 = (snap.p1a === actual || snap.p1b === actual);
                const h2 = (snap.p2a === actual || snap.p2b === actual);
                const h3 = (snap.p3a === actual || snap.p3b === actual);
                const h4 = (snap.p4a === actual || snap.p4b === actual);
                
                if (h1) curStreak1++; else curStreak1 = 0;
                if (h2) curStreak2++; else curStreak2 = 0;
                if (h3) curStreak3++; else curStreak3 = 0;
                if (h4) curStreak4++; else curStreak4 = 0;
                
                if (i >= list.length - 100) {
                    records.push({ nbr: nbrStr, nums: item.nums, sum: item.sum, actual, h1, h2, h3, h4 });
                }
            }
        }
        
        stats.streak1 = curStreak1; stats.streak2 = curStreak2;
        stats.streak3 = curStreak3; stats.streak4 = curStreak4;
        
        $('stat1').innerText = stats.streak1; $('total1').innerText = simStats.hit1; $('rate1').innerText = simStats.total1 ? ((simStats.hit1 / simStats.total1)*100).toFixed(1)+'%' : '0%';
        $('stat2').innerText = stats.streak2; $('total2').innerText = simStats.hit2; $('rate2').innerText = simStats.total2 ? ((simStats.hit2 / simStats.total2)*100).toFixed(1)+'%' : '0%';
        $('stat3').innerText = stats.streak3; $('total3').innerText = simStats.hit3; $('rate3').innerText = simStats.total3 ? ((simStats.hit3 / simStats.total3)*100).toFixed(1)+'%' : '0%';
        $('stat4').innerText = stats.streak4; $('total4').innerText = simStats.hit4; $('rate4').innerText = simStats.total4 ? ((simStats.hit4 / simStats.total4)*100).toFixed(1)+'%' : '0%';
        
        const div = $('history');
        if (records.length === 0) {
            div.innerHTML = '<div class="history-item" style="justify-content:center;color:var(--text-muted);">暂无快照记录</div>';
        } else {
            div.innerHTML = records.reverse().map(r => `
                <div class="history-item">
                    <div style="width: 80px; color:#94a3b8">#${esc(r.nbr)}<br>${r.nums.join('+')}=${r.sum}</div>
                    <div style="flex:1; text-align:right;">
                        <span class="badge ${r.h1 ? 'hit' : 'miss'}">一</span>
                        <span class="badge ${r.h2 ? 'hit' : 'miss'}">二</span>
                        <span class="badge ${r.h3 ? 'hit' : 'miss'}">三</span>
                        <span class="badge ${r.h4 ? 'hit' : 'miss'}">四</span>
                    </div>
                </div>
            `).join('');
        }
    }

    function updateLatest(){
        if (!draws.length) return;
        const last = draws[draws.length - 1];
        $('latestPeriod').innerText = `#${esc(last.expect)} 期`;
        $('latestNums').innerText = last.nums.join(' + ') + ' = ' + last.sum;
        $('latestType').innerText = getProperty(last.sum);
        $('srcTag').innerText = lastVia ? `${lastVia}` : '连接中...';
    }

    function renderPrediction(){
        if (!draws.length) return;
        const last = draws[draws.length - 1];
        const nextNbr = (parseInt(last.expect, 10) || 0) + 1;
        const nextNbrStr = String(nextNbr);
        
        let snap = snapshots[nextNbrStr];
        
        if (!snap) {
            const { m1, m2, m3, m4 } = runExtractionFormulas(nextNbr);
            
            snap = {
                p1a: m1.pa, p1b: m1.pb, t1_1: m1.t1, t1_2: m1.t2, seed1: m1.seed,
                p2a: m2.pa, p2b: m2.pb, t2_1: m2.t1, t2_2: m2.t2, seed2: m2.seed,
                p3a: m3.pa, p3b: m3.pb, t3_1: m3.t1, t3_2: m3.t2, seed3: m3.seed,
                p4a: m4.pa, p4b: m4.pb, t4_1: m4.t1, t4_2: m4.t2, seed4: m4.seed
            };
            snapshots[nextNbrStr] = snap;
            saveState();
        }

        $('title1').innerText = `深渊一预测 (#${nextNbrStr})`;
        $('title2').innerText = `深渊二预测 (#${nextNbrStr})`;
        $('title3').innerText = `深渊三预测 (#${nextNbrStr})`;
        $('title4').innerText = `深渊四预测 (#${nextNbrStr})`;
        
        $('outP1').innerText = `${snap.p1a} / ${snap.p1b}`;
        $('outP2').innerText = `${snap.p2a} / ${snap.p2b}`;
        $('outP3').innerText = `${snap.p3a} / ${snap.p3b}`;
        $('outP4').innerText = `${snap.p4a} / ${snap.p4b}`;

        // 使用混沌种子生成特码
        const makeCodes = (p, seedStr) => generateChaosCodes(p, seedStr).map(c => `<span class="code-badge">${formatNum(c)}</span>`).join('');
        
        $('codes1').innerHTML = `<span>特:</span> ${makeCodes(snap.p1a, snap.seed1)}${makeCodes(snap.p1b, snap.seed1)}`;
        $('codes2').innerHTML = `<span>特:</span> ${makeCodes(snap.p2a, snap.seed2)}${makeCodes(snap.p2b, snap.seed2)}`;
        $('codes3').innerHTML = `<span>特:</span> ${makeCodes(snap.p3a, snap.seed3)}${makeCodes(snap.p3b, snap.seed3)}`;
        $('codes4').innerHTML = `<span>特:</span> ${makeCodes(snap.p4a, snap.seed4)}${makeCodes(snap.p4b, snap.seed4)}`;

        $('dt1').innerHTML = `算得宇宙大数 = ${snap.t1_1}<br>提取末尾十位 = ${snap.t1_2}<br>推算 = ${snap.p1a}, ${snap.p1b}`;
        $('dt2').innerHTML = `算得混沌值 = ${snap.t2_1}<br>${snap.t2_2}<br>推算 = ${snap.p2a}, ${snap.p2b}`;
        $('dt3').innerHTML = `基数 = ${snap.t3_1}<br>${snap.t3_2}<br>推算 = ${snap.p3a}, ${snap.p3b}`;
        $('dt4').innerHTML = `算得两个尾数 = ${snap.t4_1} , ${snap.t4_2}<br>推算 = ${snap.p4a}, ${snap.p4b}`;

        $('predArea').style.display = 'block';
    }

    const DRAW_INTERVAL = 210;
    function startCountdown(openTimeSec){
        clearInterval(timer);
        let base = (typeof openTimeSec === 'number' && openTimeSec > 0 && openTimeSec * 1000 <= Date.now() + 60000) ? openTimeSec * 1000 : Date.now();
        const target = base + DRAW_INTERVAL * 1000;

        const tick = () => {
            const left = Math.round((target - Date.now()) / 1000);
            if (left <= 0){
                $('countdown').textContent = '🔄 开奖中...';
                clearInterval(timer);
                let retryCount = 0;
                const fastPoll = async () => {
                    if (retryCount >= 10) {
                        $('countdown').textContent = '⚠️ 官网数据延迟';
                        setTimeout(() => load(), 15000);
                        return;
                    }
                    retryCount++;
                    const success = await load();
                    if (success && draws.length > 0) return;
                    setTimeout(fastPoll, 3000);
                };
                setTimeout(fastPoll, 1000);
                return;
            }
            $('countdown').textContent = `⏳ 距下期开奖 ${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
        };
        tick();
        timer = setInterval(tick, 1000);
    }

    async function load(isManual = false){
        if (requesting) return false;
        requesting = true;
        if (isManual) $('countdown').textContent = '⏳ 强制获取中...';
        
        try {
            const r = await fetchData();
            if (!r.ok) throw new Error(r.msg);
            
            draws = r.h.slice().sort((a, b) => (parseInt(a.expect, 10) || 0) - (parseInt(b.expect, 10) || 0));
            lastVia = r.via;
            
            simulateHistory(draws);
            processHistory(draws);
            updateLatest();
            renderPrediction();
            
            const last = draws[draws.length - 1];
            startCountdown(last ? last.opentime : null);
            requesting = false;
            return true;
        } catch (e) {
            $('countdown').textContent = '⚠️ 网络波动...';
            requesting = false;
            return false;
        }
    }

    function forceRefresh() {
        if (requesting) return;
        load(true);
    }

    function updateClock(){
        const now = new Date();
        $('clock').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
        $('date').innerText = now.toISOString().split('T')[0];
    }

    window.onload = () => {
        loadState();
        updateClock(); setInterval(updateClock, 1000);
        load();
        refreshTimer = setInterval(() => { if (!requesting) load(); }, 60000);
    };
    document.onvisibilitychange = () => {
        clearInterval(refreshTimer);
        if (!document.hidden) {
            load();
            refreshTimer = setInterval(() => { if (!requesting) load(); }, 60000);
        }
    };
    </script>
</body>
                      </html>
